<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Môn học - Minh Khai</title>

    <style>
        table {
            border-collapse: collapse;
            width: 800px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        th {
            text-align: center;
        }

        td:first-child {
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>CÁC MÔN HỌC CÓ NHÀ XUẤT BẢN MINH KHAI</h2>

    <table>
        <thead>
            <tr>
                <th>STT</th>
                <th>Tên môn học</th>
                <th>Nhà xuất bản</th>
                <th>Tác giả</th>
            </tr>
        </thead>

        <tbody id="dsmonhoc"></tbody>
    </table>

    <script>

        var xhttp = new XMLHttpRequest();

        xhttp.open("GET", "dsmonhoc.xml", true);

        xhttp.onload = function () {

            if (this.status == 200) {

                var xmlDoc = this.responseXML;

                var subjects = xmlDoc.getElementsByTagName("subject");

                var table = "";
                var stt = 1;

                for (var i = 0; i < subjects.length; i++) {

                    var title = subjects[i]
                        .getElementsByTagName("title")[0]
                        .textContent;

                    var publisher = subjects[i]
                        .getElementsByTagName("publisher")[0]
                        .textContent;

                    var author = subjects[i]
                        .getElementsByTagName("author")[0]
                        .textContent;

                    // Chỉ lấy nhà xuất bản Minh Khai
                    if (publisher == "Minh Khai") {

                        table += `
                            <tr>
                                <td>${stt}</td>
                                <td>${title}</td>
                                <td>${publisher}</td>
                                <td>${author}</td>
                            </tr>
                        `;

                        stt++;
                    }
                }

                document.getElementById("dsmonhoc").innerHTML = table;
            }
        };

        xhttp.send();

    </script>

</body>
</html>
