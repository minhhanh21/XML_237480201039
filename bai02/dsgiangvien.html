<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh sách giảng viên</title>

    <style>
        table {
            border-collapse: collapse;
            width: 800px;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
        }

        th {
            text-align: center;
        }

        td:first-child {
            text-align: center;
        }
    </style>
</head>

<body>

    <h2>DANH SÁCH GIẢNG VIÊN</h2>

    <table>
        <tr>
            <th>STT</th>
            <th>Họ tên giảng viên</th>
            <th>Ngành</th>
            <th>Đơn vị</th>
        </tr>

        <tbody id="danhsach"></tbody>
    </table>

    <script>

        // Tạo XMLHttpRequest
        var xhttp = new XMLHttpRequest();

        // Mở file XML
        xhttp.open("GET", "hosogiangvien.xml", true);

        // Xử lý khi đọc XML xong
        xhttp.onload = function() {

            if (this.status == 200) {

                // Lấy dữ liệu XML
                var xmlDoc = this.responseXML;

                // Lấy tất cả giảng viên
                var giangvien =
                    xmlDoc.getElementsByTagName("giangvien");

                var kq = "";

                // Duyệt danh sách giảng viên
                for (var i = 0; i < giangvien.length; i++) {

                    var hoten =
                        giangvien[i]
                        .getElementsByTagName("hoten")[0]
                        .textContent;

                    var nganh =
                        giangvien[i]
                        .getElementsByTagName("nganh")[0]
                        .textContent;

                    var donvi =
                        giangvien[i]
                        .getElementsByTagName("donvi")[0]
                        .textContent;

                    kq += "<tr>";

                    kq += "<td>" + (i + 1) + "</td>";
                    kq += "<td>" + hoten + "</td>";
                    kq += "<td>" + nganh + "</td>";
                    kq += "<td>" + donvi + "</td>";

                    kq += "</tr>";
                }

                // Xuất ra màn hình
                document.getElementById("danhsach").innerHTML = kq;
            }
        };

        // Gửi yêu cầu
        xhttp.send();

    </script>

</body>
</html>
